name: 监测 Upstream 版本 Tag

on:
  schedule:
    # UTC 15:00，即北京时间 23:00。
    - cron: '0 15 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: upstream-release-monitor
  cancel-in-progress: false

jobs:
  monitor:
    name: 检查新版本 Tag
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      UPSTREAM_REPOSITORY: shy3130/tickflow-stock-panel
      SYNC_STATE: .github/upstream-sync-state.json
    steps:
      - name: 检出当前 main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: 获取 upstream Tags
        run: |
          gh api --paginate --slurp \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/${UPSTREAM_REPOSITORY}/tags?per_page=100" \
            > "${RUNNER_TEMP}/upstream-tags.json"

      - name: 选择最新版本 Tag
        id: release
        run: |
          python3 .github/scripts/select_upstream_release.py \
            --state "${SYNC_STATE}" \
            --tags "${RUNNER_TEMP}/upstream-tags.json" \
            --github-output "${GITHUB_OUTPUT}"

      - name: 没有新版本
        if: steps.release.outputs.status == 'no_change'
        run: echo "upstream 最新版本仍为 ${{ steps.release.outputs.tag }}，无需处理。"

      - name: 创建同步或 Tag 异常 Issue
        if: >-
          steps.release.outputs.status == 'new_release' ||
          steps.release.outputs.status == 'retagged' ||
          steps.release.outputs.status == 'tag_missing'
        env:
          STATUS: ${{ steps.release.outputs.status }}
          TAG: ${{ steps.release.outputs.tag }}
          COMMIT_SHA: ${{ steps.release.outputs.commit }}
          PREVIOUS_TAG: ${{ steps.release.outputs.previous_tag }}
          PREVIOUS_COMMIT: ${{ steps.release.outputs.previous_commit }}
        run: |
          marker="<!-- upstream-sync:${STATUS}:${UPSTREAM_REPOSITORY}:${TAG}:${COMMIT_SHA} -->"
          case "${STATUS}" in
            new_release)
              title="[Upstream] 同步 ${TAG}"
              ;;
            retagged)
              title="[Upstream 安全告警] ${TAG} 指向发生变化"
              ;;
            tag_missing)
              title="[Upstream 安全告警] ${TAG} 已删除"
              ;;
            *)
              echo "不支持的 upstream 状态: ${STATUS}" >&2
              exit 1
              ;;
          esac

          issues_json="${RUNNER_TEMP}/repository-issues.json"
          gh api --paginate --slurp \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/${GITHUB_REPOSITORY}/issues?state=all&per_page=100" \
            > "${issues_json}"

          if jq -e \
            --arg marker "${marker}" \
            --arg expected_title "${title}" \
            -f .github/scripts/trusted_upstream_issue.jq \
            "${issues_json}" >/dev/null; then
            echo "Tag ${TAG} 的跟踪 Issue 已存在，不重复创建。"
            exit 0
          fi

          gh label create upstream-sync \
            --repo "${GITHUB_REPOSITORY}" \
            --color 0E8A16 \
            --description '由自动化发现的 upstream 版本同步' \
            --force

          body_file="${RUNNER_TEMP}/upstream-issue.md"
          if [ "${STATUS}" != 'new_release' ]; then
            gh label create upstream-security \
              --repo "${GITHUB_REPOSITORY}" \
              --color B60205 \
              --description 'upstream Tag 完整性异常，禁止自动同步' \
              --force
            labels='upstream-sync,upstream-security'
            if [ "${STATUS}" = 'retagged' ]; then
              printf -v detail '已同步版本 Tag `%s` 原来指向 `%s`，当前同版本 Tag `%s` 指向 `%s`。' \
                "${PREVIOUS_TAG}" "${PREVIOUS_COMMIT}" "${TAG}" "${COMMIT_SHA}"
            else
              printf -v detail '已同步版本 Tag `%s`（`%s`）已从 upstream Tags 列表消失。' \
                "${PREVIOUS_TAG}" "${PREVIOUS_COMMIT}"
            fi
            {
              printf '%s\n\n' "${marker}"
              printf '## 异常\n\n'
              printf '%s\n\n' "${detail}"
              printf '版本 Tag 被改写或删除时禁止自动合并。请人工核验 upstream 历史和发布来源；确认前不要创建同步 PR。\n\n'
              printf '此 Issue 仅包含经固定格式校验的 Tag 和 commit SHA，没有读取 upstream Release 文案。\n'
            } > "${body_file}"
          else
            labels='upstream-sync'
            {
              printf '%s\n\n' "${marker}"
              printf '## Upstream 版本\n\n'
              printf -- '- Repository: `%s`\n' "${UPSTREAM_REPOSITORY}"
              printf -- '- Tag: `%s`\n' "${TAG}"
              printf -- '- Commit: `%s`\n' "${COMMIT_SHA}"
              printf -- '- 上次已同步版本: `%s` (`%s`)\n\n' \
                "${PREVIOUS_TAG}" "${PREVIOUS_COMMIT}"
              printf '## 自动处理要求\n\n'
              printf 'ChatGPT 定时任务应按照 `.github/prompts/upstream-release-sync.md` 在隔离 worktree 中处理本 Issue。验证通过后创建 Draft PR，并使用 `Closes #<本 Issue 编号>` 关联；禁止自动合并。\n\n'
              printf '此 Issue 仅包含经固定格式校验的 Tag 和 commit SHA，没有读取 upstream Release 文案。\n'
            } > "${body_file}"
          fi

          gh issue create \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${title}" \
            --label "${labels}" \
            --body-file "${body_file}"
