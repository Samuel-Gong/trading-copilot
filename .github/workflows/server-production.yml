name: UCloud 生产发布

# 受保护的 main 每次更新都会构建不可变发布包并自动上线。
# workflow_dispatch 只用于重试 main 当前 SHA；production Environment 仍只允许 main。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tickflow-production
  cancel-in-progress: false

jobs:
  package:
    name: 构建服务端发布包
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: 安装 Python 3.12
        run: uv python install 3.12

      - name: 验证后端
        working-directory: backend
        run: |
          uv sync --frozen --no-install-project --extra dev --extra backtest
          uv run --no-sync ruff check app tests --select E9,F63,F7
          env -u HTTP_PROXY -u HTTPS_PROXY -u ALL_PROXY \
            -u http_proxy -u https_proxy -u all_proxy \
            uv run --no-sync python -m pytest -q

      - name: 发布包安全校验负例
        run: |
          bash ops/tests/test_archive_validation.sh
          bash ops/tests/test_deploy_ssh.sh

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.10.0

      - name: 安装 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: 构建前端
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: 组装不可变发布包
        id: release
        shell: bash
        run: |
          set -Eeuo pipefail
          short_sha="${GITHUB_SHA:0:12}"
          release_name="tickflow-server-${short_sha}"
          package_root="${RUNNER_TEMP}/${release_name}"

          mkdir -p "${package_root}/backend" "${package_root}/frontend"
          cp -a backend/app backend/pyproject.toml backend/uv.lock "${package_root}/backend/"
          cp -a frontend/dist "${package_root}/frontend/"
          cp tiers.yaml VERSION README.md LICENSE "${package_root}/"

          build_time="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          {
            echo "GIT_SHA=${GITHUB_SHA}"
            echo "BUILD_TIME=${build_time}"
          } > "${package_root}/.release.env"

          tar -C "${RUNNER_TEMP}" -czf "${release_name}.tar.gz" "${release_name}"
          sha256sum "${release_name}.tar.gz" > "${release_name}.tar.gz.sha256"
          echo "release_name=${release_name}" >> "${GITHUB_OUTPUT}"

      - name: 上传发布包
        uses: actions/upload-artifact@v4
        with:
          name: tickflow-server-${{ github.sha }}
          path: |
            ${{ steps.release.outputs.release_name }}.tar.gz
            ${{ steps.release.outputs.release_name }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30

  deploy-production:
    name: 部署生产环境
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: package
    runs-on: ubuntu-latest
    permissions: {}
    environment:
      name: production
    timeout-minutes: 60
    steps:
      - name: 下载本次发布包
        uses: actions/download-artifact@v4
        with:
          name: tickflow-server-${{ github.sha }}
          path: ${{ runner.temp }}/server-artifact-${{ github.sha }}

      - name: 准备生产 SSH 凭据
        env:
          UCLOUD_SSH_PRIVATE_KEY: ${{ secrets.UCLOUD_SSH_PRIVATE_KEY }}
          UCLOUD_SSH_KNOWN_HOSTS: ${{ secrets.UCLOUD_SSH_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -Eeuo pipefail
          install -d -m 0700 "${HOME}/.ssh"
          install -m 0600 /dev/null "${HOME}/.ssh/tickflow-production"
          printf '%s\n' "${UCLOUD_SSH_PRIVATE_KEY}" > "${HOME}/.ssh/tickflow-production"
          printf '%s\n' "${UCLOUD_SSH_KNOWN_HOSTS}" > "${HOME}/.ssh/known_hosts"
          test -s "${HOME}/.ssh/tickflow-production"
          test -s "${HOME}/.ssh/known_hosts"
          ssh-keygen -y -f "${HOME}/.ssh/tickflow-production" >/dev/null

          cat > "${HOME}/.ssh/config" <<EOF
          Host tickflow-production
              HostName 106.75.247.19
              User tickflow-deploy
              IdentityFile ${HOME}/.ssh/tickflow-production
              UserKnownHostsFile ${HOME}/.ssh/known_hosts
              BatchMode yes
              IdentitiesOnly yes
              StrictHostKeyChecking yes
              RequestTTY no
          EOF
          chmod 0600 "${HOME}/.ssh/config"

      - name: 上传本次发布包
        shell: bash
        run: |
          set -Eeuo pipefail
          artifact_dir="${RUNNER_TEMP}/server-artifact-${GITHUB_SHA}"
          archive="${artifact_dir}/tickflow-server-${GITHUB_SHA:0:12}.tar.gz"
          test -f "${archive}"
          test -f "${archive}.sha256"
          archive_name="$(basename -- "${archive}")"
          ssh tickflow-production "upload ${archive_name}" < "${archive}"
          ssh tickflow-production "upload ${archive_name}.sha256" < "${archive}.sha256"

      - name: 提交并等待服务器托管的生产部署
        shell: bash
        run: |
          set -Eeuo pipefail
          archive_name="tickflow-server-${GITHUB_SHA:0:12}.tar.gz"
          job_id="$(ssh tickflow-production "submit ${archive_name}")"
          [[ "${job_id}" =~ ^deploy-[0-9a-f]{12}-[0-9]{8}T[0-9]{6}Z-[0-9]+$ ]]

          for attempt in $(seq 1 720); do
            status="$(ssh tickflow-production "status ${job_id}")"
            case "${status}" in
              success)
                printf '服务器部署成功: %s\n' "${job_id}"
                exit 0
                ;;
              failed:*)
                printf '服务器部署失败: %s (%s)\n' "${job_id}" "${status}" >&2
                exit 1
                ;;
              queued|running)
                sleep 5
                ;;
              *)
                printf '未知服务器部署状态: %s\n' "${status}" >&2
                exit 1
                ;;
            esac
          done

          printf '等待服务器部署超时；远端 systemd 事务不会随 Actions 中断，请检查任务 %s\n' "${job_id}" >&2
          exit 1

      - name: 清理上传暂存文件
        if: always()
        shell: bash
        run: |
          if [[ ! -s "${HOME}/.ssh/config" ]]; then
            exit 0
          fi
          archive_name="tickflow-server-${GITHUB_SHA:0:12}.tar.gz"
          ssh tickflow-production "cleanup ${archive_name}" || true
