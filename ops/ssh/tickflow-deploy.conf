Match User tickflow-deploy
    AuthorizedKeysFile /etc/ssh/authorized_keys/tickflow-deploy
    AuthenticationMethods publickey
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    PermitTTY no
    X11Forwarding no
    AllowAgentForwarding no
    AllowTcpForwarding no
    PermitTunnel no
    DisableForwarding yes
    ForceCommand /usr/local/sbin/tickflow-deploy-ssh
